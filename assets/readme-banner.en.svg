<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="title description">
  <title id="title">System Pulse</title>
  <desc id="description">The System Pulse name over a dark blue background, with a glowing heartbeat line crossing the banner.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1628"/>
      <stop offset=".55" stop-color="#132440"/>
      <stop offset="1" stop-color="#0F2A3A"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#54E1C1" stop-opacity="0"/>
      <stop offset=".2" stop-color="#54E1C1" stop-opacity=".9"/>
      <stop offset=".75" stop-color="#81B9FF"/>
      <stop offset="1" stop-color="#81B9FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#BFE9FF"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientTransform="matrix(0 260 -360 0 180 40)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#54E1C1" stop-opacity=".22"/>
      <stop offset="1" stop-color="#54E1C1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="0" cy="0" r="1" gradientTransform="matrix(0 280 -380 0 1060 340)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#81B9FF" stop-opacity=".2"/>
      <stop offset="1" stop-color="#81B9FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" stroke="#B9D4FF" stroke-opacity=".05"/>
    </pattern>
    <filter id="blur" x="-10%" y="-100%" width="120%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="360" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#background)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <rect width="1200" height="360" fill="url(#glowLeft)"/>
    <rect width="1200" height="360" fill="url(#glowRight)"/>

    <!-- Batimento: linha base com dois picos -->
    <g transform="translate(0 286)">
      <path d="M0 0H330l14-6 12 6 16-46 18 84 15-58 11 20h272l14-6 12 6 16-46 18 84 15-58 11 20H1200" stroke="url(#pulse)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#blur)" opacity=".7"/>
      <path d="M0 0H330l14-6 12 6 16-46 18 84 15-58 11 20h272l14-6 12 6 16-46 18 84 15-58 11 20H1200" stroke="url(#pulse)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="372" cy="-46" r="5" fill="#7AF0D3"/>
      <circle cx="730" cy="-46" r="5" fill="#9CC8FF"/>
    </g>
  </g>

  <rect x=".5" y=".5" width="1199" height="359" rx="27.5" stroke="#B9D4FF" stroke-opacity=".12"/>

  <!-- Chip da barra superior -->
  <g transform="translate(600 62)">
    <rect x="-128" y="-17" width="256" height="34" rx="17" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".14"/>
    <circle cx="-104" cy="0" r="5" fill="#54E1C1"/>
    <text x="8" y="5.5" text-anchor="middle" fill="#DCE8F7" font-family="ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" letter-spacing=".3">CPU 12% · RAM 41%</text>
  </g>

  <text x="600" y="168" text-anchor="middle" fill="url(#headline)" font-family="'Cantarell', 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="78" font-weight="800" letter-spacing="-1.5">System Pulse</text>
  <text x="600" y="212" text-anchor="middle" fill="#9FB6D3" font-family="'Cantarell', 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" letter-spacing=".2">Your system’s pulse, always in sight on the GNOME top bar.</text>
</svg>
